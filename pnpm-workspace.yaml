packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11.x scoped-builds approval. Setting `true` lets the package run its
# postinstall scripts; `false` blocks. Each one reviewed and known-safe.
allowBuilds:
  '@sentry/cli': true # downloads the Sentry CLI binary for sourcemap upload
  '@swc/core': true # downloads native swc binary (Next.js compiler)
  core-js: true # polyfill init — harmless
  protobufjs: true # generates parser bindings

# Legacy field kept for compatibility with older pnpm clients.
onlyBuiltDependencies:
  - '@swc/core'
  - '@sentry/cli'
  - core-js
  - protobufjs
