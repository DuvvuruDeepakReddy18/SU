# Render.com blueprint — provisions the NestJS API as a free Web Service.
# After signing up at render.com, click "New" → "Blueprint" → connect this
# GitHub repo → Render auto-detects this file and creates the service.
#
# You'll be prompted to fill in env values listed under envVars (the ones
# without `value` / `generateValue` need to be filled manually). See DEPLOY.md
# for where to get each value.

services:
  - type: web
    name: skillverify-api
    runtime: node
    plan: free
    # Co-located with the data layer (Neon / Upstash / Supabase all in
    # ap-southeast-1) so DB + Redis round-trips stay local instead of crossing
    # the Pacific on every query.
    region: singapore
    # Free Web Services on Render sleep after 15 min idle. First request after
    # sleep takes ~30s to wake. Upgrade to Starter ($7/mo) to keep always-on.
    branch: main
    rootDir: .
    buildCommand: |
      corepack enable && corepack prepare pnpm@11.1.3 --activate
      pnpm install --frozen-lockfile
      pnpm --filter @skillverify/shared build
      pnpm --filter @skillverify/db generate
      pnpm --filter @skillverify/db build
      pnpm --filter @skillverify/ui build
      pnpm --filter @skillverify/api build
    startCommand: |
      pnpm --filter @skillverify/db migrate:deploy
      node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # ---- Provided by you in the Render dashboard ----
      - key: DATABASE_URL
        sync: false # Neon Postgres connection string (?sslmode=require)
      - key: REDIS_URL
        sync: false # Upstash Redis connection string (rediss://...)
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false # your Vercel URL, e.g. https://skillverify.vercel.app
      - key: CORS_ORIGINS
        sync: false # same as NEXTAUTH_URL (comma-separated for more)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_RESUME_MODEL
        value: openai/gpt-oss-120b:free
      - key: OPENROUTER_RESUME_FALLBACKS
        value: deepseek/deepseek-v4-flash:free,nvidia/nemotron-3-super-120b-a12b:free
      - key: OPENROUTER_FEEDBACK_MODEL
        value: openai/gpt-oss-20b:free
      - key: OPENROUTER_FEEDBACK_FALLBACKS
        value: qwen/qwen3-coder:free,openai/gpt-oss-120b:free,meta-llama/llama-3.3-70b-instruct:free
      - key: S3_ENDPOINT
        sync: false # Supabase Storage S3 endpoint
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        value: skillverify
      - key: S3_KEY
        sync: false
      - key: S3_SECRET
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      # Transactional email (verification, password reset, notifications).
      # WITHOUT this the API still runs, but every email silently no-ops.
      - key: RESEND_API_KEY
        sync: false
      # Error monitoring — no-op until set.
      - key: SENTRY_DSN
        sync: false
      # Payments (Razorpay) — interviews stay "free during beta" until set.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Practice runner — Render Linux has Python + Node, so local runner works
      - key: CODE_RUNNER_BACKEND
        value: local
