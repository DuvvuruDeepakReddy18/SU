# Render.com blueprint — provisions the NestJS API as a free Web Service.
# After signing up at render.com, click "New" → "Blueprint" → connect this
# GitHub repo → Render auto-detects this file and creates the service.
#
# You'll be prompted to fill in env values listed under envVars (the ones
# without `value` / `generateValue` need to be filled manually). See DEPLOY.md
# for where to get each value.

services:
  - type: web
    name: skillverify-api
    runtime: node
    plan: free
    # Co-located with the data layer (Neon / Upstash / Supabase all in
    # ap-southeast-1) so DB + Redis round-trips stay local instead of crossing
    # the Pacific on every query.
    region: singapore
    # Free Web Services on Render sleep after 15 min idle. First request after
    # sleep takes ~30s to wake. Upgrade to Starter ($7/mo) to keep always-on.
    branch: main
    rootDir: .
    # Render provisions pnpm@11.1.3 from the root package.json `packageManager`
    # field, so no corepack step is needed (it also fails on Render's read-only
    # /usr/bin). Node is pinned via .node-version.
    buildCommand: |
      pnpm install --frozen-lockfile
      pnpm --filter @skillverify/shared build
      pnpm --filter @skillverify/db generate
      pnpm --filter @skillverify/db build
      pnpm --filter @skillverify/ui build
      pnpm --filter @skillverify/api build
    startCommand: |
      pnpm --filter @skillverify/db migrate:deploy
      node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # ---- Provided by you in the Render dashboard ----
      - key: DATABASE_URL
        sync: false # Neon Postgres connection string (?sslmode=require)
      - key: REDIS_URL
        sync: false # Upstash Redis connection string (rediss://...)
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false # your Vercel URL, e.g. https://skillverify.vercel.app
      - key: CORS_ORIGINS
        sync: false # same as NEXTAUTH_URL (comma-separated for more)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_RESUME_MODEL
        value: openai/gpt-oss-120b:free
      - key: OPENROUTER_RESUME_FALLBACKS
        value: deepseek/deepseek-v4-flash:free,nvidia/nemotron-3-super-120b-a12b:free
      - key: OPENROUTER_FEEDBACK_MODEL
        value: openai/gpt-oss-20b:free
      - key: OPENROUTER_FEEDBACK_FALLBACKS
        value: qwen/qwen3-coder:free,openai/gpt-oss-120b:free,meta-llama/llama-3.3-70b-instruct:free
      - key: S3_ENDPOINT
        sync: false # Supabase Storage S3 endpoint
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        value: skillverify
      - key: S3_KEY
        sync: false
      - key: S3_SECRET
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      # Transactional email (verification, password reset, notifications).
      # WITHOUT this the API still runs, but every email silently no-ops.
      - key: RESEND_API_KEY
        sync: false
      # Error monitoring — no-op until set.
      - key: SENTRY_DSN
        sync: false
      # Payments (Razorpay) — interviews stay "free during beta" until set.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Practice runner. MUST be judge0 in production — the `local` runner
      # executes user code unsandboxed on this host (RCE). Set JUDGE0_URL to a
      # hosted Judge0 to enable code execution; until then submissions just
      # error (safe). The API also hard-forces judge0 when NODE_ENV=production.
      - key: CODE_RUNNER_BACKEND
        value: judge0

  # ===================================================================
  # Staging mirror. A safe place to test risky changes (refresh-token
  # rotation, Redis, CSP tightening) before they reach prod. Deploys from
  # the `staging` branch. Point DATABASE_URL at a Neon BRANCH of prod (an
  # isolated copy) and NEXTAUTH_URL / CORS_ORIGINS at the Vercel preview URL
  # of the staging branch. Secrets are staging-only (generated), so a token
  # signed in staging is never valid on prod. Full runbook in STAGING.md.
  # Optional feature vars (S3_*, RESEND_API_KEY, SENTRY_DSN, RAZORPAY_*,
  # OPENROUTER_API_KEY, REDIS_URL) no-op if unset; add them in the Render
  # dashboard only when you want to exercise those features in staging.
  # ===================================================================
  - type: web
    name: skillverify-api-staging
    runtime: node
    plan: free
    region: singapore
    branch: staging
    rootDir: .
    buildCommand: |
      pnpm install --frozen-lockfile
      pnpm --filter @skillverify/shared build
      pnpm --filter @skillverify/db generate
      pnpm --filter @skillverify/db build
      pnpm --filter @skillverify/ui build
      pnpm --filter @skillverify/api build
    startCommand: |
      pnpm --filter @skillverify/db migrate:deploy
      node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production # prod-like behavior; full error detail still goes to Render logs
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Neon STAGING branch (isolated) — never the prod branch
      - key: JWT_SECRET
        generateValue: true # staging-only, so a staging token can't be used on prod
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false # the staging web preview URL (Vercel)
      - key: CORS_ORIGINS
        sync: false # same as NEXTAUTH_URL
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: CODE_RUNNER_BACKEND
        value: judge0
