name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: skillverify
          POSTGRES_PASSWORD: skillverify
          POSTGRES_DB: skillverify
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U skillverify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://skillverify:skillverify@localhost:5432/skillverify?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-please-replace-me
      ENCRYPTION_KEY: ci-encryption-key-please-replace
      NEXTAUTH_SECRET: ci-nextauth-secret
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # Apply migrations against the throwaway CI postgres so any
      # integration-style tests (later) have a real schema to talk to.
      # `migrate deploy` is non-interactive and is the right CI invocation.
      - name: Apply migrations
        run: pnpm --filter @skillverify/db migrate:deploy

      # Seed reference data (institutions, skills, problems) so the e2e
      # smoke tests have real rows to read and sign up against. Idempotent.
      - name: Seed database
        run: pnpm --filter @skillverify/db seed:prod

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # End-to-end smoke tests — boot the real Nest app against the CI
      # Postgres + Redis and exercise signup / login / public reads.
      - name: E2E smoke tests
        run: pnpm --filter @skillverify/api test:e2e:ci
